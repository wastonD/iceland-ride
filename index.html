<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rainforest Roam</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1210; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #cfe0d6; font: 300 15px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0.3em; background: #0b1210; transition: opacity 1.6s ease; z-index: 10;
    }
    #loading.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui-root"></div>
  <div id="loading"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
